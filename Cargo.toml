[package]
name = "base-x"
description = "Encode/decode any base"
version = "0.3.0"
edition = "2024"
authors = ["Alex R. <alexei.rudenko@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["base-x", "base", "convert"]
repository = "https://github.com/OrKoN/base-x-rs"
homepage = "https://github.com/OrKoN/base-x-rs"
categories = ["value-formatting"]

[dev-dependencies]
serde_json = "1"
bencher = "0.1"
rand = "0.9.5"

[[bench]]
name = "base"
harness = false

[features]
default = ["std"]
std = []
